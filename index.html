<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Example</title>
  </head>
  <body>
    <h2>WebSocket Demo</h2>

    <input type="text" id="messageBox" placeholder="Enter message" />
    <button onclick="sendMessage()">Send</button>

    <div id="messages"></div>

    <script>
      // Replace with your WebSocket server URL
      const socket = new WebSocket("https://localhost:8000/media?leadId=10&callId=15"
       // const socket = new WebSocket("wss://sd8081.elb.cisinlive.com/media?leadId=1&callId=32")
                
      );

      socket.onopen = () => {
        console.log("Connected to WebSocket");
        addMessage("Connected to WebSocket");
      };

      socket.onmessage = (event) => {
        console.log("Received:", event.data);
        addMessage("Server: " + event.data);
      };

      socket.onerror = (error) => {
        console.log("WebSocket Error:", error);
      };

      socket.onclose = () => {
        console.log("WebSocket connection closed");
        addMessage("Connection closed");
      };

      function sendMessage() {
        const msg = document.getElementById("messageBox").value;
        socket.send(msg);
        addMessage("You: " + msg);
      }

      function addMessage(msg) {
        const div = document.createElement("p");
        div.textContent = msg;
        document.getElementById("messages").appendChild(div);
      }
    </script>
  </body>
</html>
